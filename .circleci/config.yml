version: 2.1
jobs:
  build:
    docker:
      - image: eclipse-temurin:27-jdk  # No cimg/openjdk 27 image yet
    working_directory: ~/repo

    environment:
      # Customize the JVM maximum heap limit
      MAVEN_OPTS: -Xmx3200m
    steps:
      - checkout
      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: ./mvnw dependency:go-offline -s .circleci/settings.xml
      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}
      # Only main publishes to PackageCloud; other branches just build and test
      - when:
          condition:
            equal: [ main, << pipeline.git.branch >> ]
          steps:
            - run: ./mvnw clean deploy -Ppackagecloud -s .circleci/settings.xml
      - unless:
          condition:
            equal: [ main, << pipeline.git.branch >> ]
          steps:
            - run: ./mvnw clean verify -s .circleci/settings.xml
workflows:
  main:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
                - upgrade-java-27  # TODO: remove before merging
